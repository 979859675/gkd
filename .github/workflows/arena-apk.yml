name: arena-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: install android sdk packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools" || true
          sdkmanager --list_installed | head -40

      - uses: gradle/actions/setup-gradle@v4

      - name: build release apk
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"
        run: ./gradlew :gkd-android:assembleGkdRelease --stacktrace

      - name: list outputs
        if: always()
        run: find gkd-android/build/outputs -name "*.apk" -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: warn
