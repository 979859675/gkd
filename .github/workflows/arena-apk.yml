name: arena-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: inspect android sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/cmdline-tools" || true

      - name: install android sdk packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: build release apk
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"
        run: ./gradlew :gkd-android:assembleGkdRelease --stacktrace

      - name: list outputs
        if: always()
        run: find gkd-android/build/outputs -name "*.apk" -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            **/build/reports/**
          if-no-files-found: ignore
