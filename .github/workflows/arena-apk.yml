name: arena-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install android sdk packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: build release apk
        id: build
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"
        run: |
          set -o pipefail
          ./gradlew :gkd-android:assembleGkdRelease --stacktrace 2>&1 | tee /tmp/build.log
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: publish build errors as annotations
        if: failure()
        run: |
          # 把编译错误拆成 check-run annotation，便于通过 API 读取。
          grep -nE "^e: |error:|What went wrong|Caused by:|^FAILURE" /tmp/build.log | tail -60 > /tmp/errors.txt || true
          while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/%0A/%250A/g' -e 's/%0D/%250D/g')
            echo "::error title=gradle::$msg"
          done < /tmp/errors.txt
          tail -c 4000 /tmp/build.log | tr '\n' ' ' | cut -c1-900 | sed 's/%/%25/g' | sed 's/^/::error title=tail::/'

      - name: verify apk contents
        run: |
          APK=$(ls gkd-android/build/outputs/apk/gkd/release/*.apk | head -1)
          echo "== apk: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E "xposed|builtin_rules|lib/.*\.so" || true
          if unzip -l "$APK" | grep -q "META-INF/xposed"; then echo "unexpected lsposed module files"; exit 1; fi
          unzip -l "$APK" | grep -q "builtin_rules/1.json5" || { echo "missing builtin rules 1"; exit 1; }
          unzip -l "$APK" | grep -q "builtin_rules/2.json5" || { echo "missing builtin rules 2"; exit 1; }
          unzip -l "$APK" | grep -E "builtin_rules" 
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          for f in /tmp/dex/classes*.dex; do strings -a "$f" | grep -E "li/gkd/app/priv/AutoStart|GkdXposedModule" | sort -u | head; done

      - uses: actions/upload-artifact@v4
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: warn

      - name: publish download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls gkd-android/build/outputs/apk/gkd/release/*.apk | head -1)
          BASE=$(basename "$APK" .apk)
          TAG="apk-${BASE}"
          NOTES=$(cat <<EOF
          GKD 自定义构建（Root/Shizuku 特权启动 + 自动开无障碍 + 常驻通知 + 内置规则文件夹，不含 LSPosed 模块）

          - 包名 / 签名：li.songe.gkd，debug 签名（与官方版签名不同，安装前需卸载官方版）
          - Root：检测到 su 后自动启动特权服务，并自动授予 WRITE_SECURE_SETTINGS
          - 无障碍：特权服务连上后自动开启首选无障碍服务
          - 常驻：自动打开常驻通知，保持前台服务，降低被系统回收的概率
          - 内置规则：内置两个订阅（奥怪的GKD订阅、id667的GKD订阅），首次启动自动导入并默认启用
          - 构建来源：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            if gh release create "$TAG" "$APK"               --title "$BASE"               --notes "$NOTES"               --latest=false; then
              echo "released $BASE"
              break
            fi
            sleep 3
          done
          gh release view "$TAG" --json url --jq .url
