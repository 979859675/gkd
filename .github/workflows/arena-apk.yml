name: arena-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install android sdk packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: build release apk
        id: build
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"
        run: |
          set -o pipefail
          ./gradlew :gkd-android:assembleGkdRelease --stacktrace 2>&1 | tee /tmp/build.log
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: publish build errors as annotations
        if: failure()
        run: |
          # 把编译错误拆成 check-run annotation，便于通过 API 读取。
          grep -nE "^e: |error:|What went wrong|Caused by:|^FAILURE" /tmp/build.log | tail -60 > /tmp/errors.txt || true
          while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/%0A/%250A/g' -e 's/%0D/%250D/g')
            echo "::error title=gradle::$msg"
          done < /tmp/errors.txt
          tail -c 4000 /tmp/build.log | tr '\n' ' ' | cut -c1-900 | sed 's/%/%25/g' | sed 's/^/::error title=tail::/'

      - uses: actions/upload-artifact@v4
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: warn
