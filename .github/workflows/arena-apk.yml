name: arena-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install android sdk packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: build release apk
        id: build
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"
        run: |
          set -o pipefail
          ./gradlew :gkd-android:assembleGkdRelease --stacktrace 2>&1 | tee /tmp/build.log
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 /tmp/build.log > /tmp/build-tail.log || true
          jq -Rs '{title: ("[build-log] run " + env.GITHUB_RUN_ID), body: .}' /tmp/build-tail.log > /tmp/issue.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" --input /tmp/issue.json

      - uses: actions/upload-artifact@v4
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
          if-no-files-found: warn
